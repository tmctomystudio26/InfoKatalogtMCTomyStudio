<!doctype html>

    <link rel="manifest" href="./manifest.webmanifest" />

            alt="Logo Manifestudio"
            width="36"
            height="36"
            class="brand-mark"
          />
          <div class="brand-text">
            <span class="brand-name">Manifestudio</span>
            <span class="brand-tagline">Kembali ke Menu Utama</span>

          <a href="./index.html" class="header-nav-link">Katalog</a>
          <button type="button" class="header-nav-link" data-tools-nav="prayer">Jadwal Sholat</button>
          <button type="button" class="header-nav-link" data-tools-nav="weather">Cuaca</button>
          <button type="button" class="header-nav-link" data-tools-nav="worldclock">Jam Dunia</button>

          <a href="./index.html" class="header-btn" aria-label="Kembali ke halaman utama">

          </a>
          <button
            type="button"
            id="theme-toggle-btn"
            class="header-btn"
            aria-label="Ubah tema tampilan"
          ></button>
        </div>
      </div>
    </header>

    <main class="tools-page-shell container">
      <div class="tools-page-head">
        <div>
          <h1 id="tools-page-title" class="section-title">Menu Lainnya</h1>
          <p id="tools-page-subtitle" class="section-subtitle">

        <a href="./index.html" class="btn btn-secondary btn-sm">← Menu Utama</a>

      <div id="tools-hub-root"></div>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <a href="./index.html" class="brand-name" style="text-decoration: none;">Manifestudio</a>
          <p>Dikelola oleh tMC Tomy Studio. © 2026 Manifestudio.</p>

        <div class="footer-links">
          <a href="./index.html" class="footer-link-btn">Katalog Utama</a>
          <a
            href="https://www.tiktok.com/@tmctomystudio"
            target="_blank"

          </a>
          <a
            href="https://www.instagram.com/tmctomystudio"
            target="_blank"
            rel="noopener noreferrer"

          >
            Instagram @tmctomystudio
          </a>
